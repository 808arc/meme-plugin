name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # learnharness-plugin-api is a local file dependency (file:.sdk).
      - name: Provide plugin SDK types
        run: cp -r learnharness-plugins/types .sdk

      - run: npm ci --no-audit --no-fund

      # Fail on high/critical advisories. Fix locally with `npm audit fix`, then commit the lockfile.
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Smoke-check the built package with the portable installer (validates manifest + files).
      - name: Validate package with installer
        run: |
          plugins="$(mktemp -d)"
          node scripts/install-plugin-local.mjs "$plugins"
          test -f "$plugins/meme-plugin/dist/manifest.json"

      - name: Upload build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: meme-plugin-dist
          path: dist/
          retention-days: 14
